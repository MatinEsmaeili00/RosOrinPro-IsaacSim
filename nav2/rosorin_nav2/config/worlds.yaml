# Scenes the robot can navigate. For each one: the saved Nav2 map (in maps/), where the robot spawns in the
# scene (= AMCL initial pose in the map frame, because every map here is drawn in scene/world coordinates),
# and named places for `ros2 run rosorin_nav2 goal --place NAME` / `--tour`.
# Poses are [x (m), y (m), yaw (deg)].
arena:
  description: "Test arena of scenes/rosorin_world.usd and RosOrin_Claude.usd (4 x 4 m walls, pillar, crate)"
  map: test_arena.yaml
  spawn: [0.0, 0.0, 0.0]
  places:
    start: [0.0, 0.0, 0.0]
    north_east: [1.3, 1.3, 90.0]
    south_west: [-1.3, -1.3, -90.0]
    behind_pillar: [1.5, -1.6, 0.0]
    by_crate: [-1.3, 0.4, 90.0]
  tour: [north_east, south_west, by_crate, start]
